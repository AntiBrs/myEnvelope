name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m compileall backend
      - run: pytest
      - run: pip-audit -r backend/requirements.txt

  mobile-web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:session
      # Expo's build-only upstream advisories are documented in SECURITY.md.
      # Keep the critical gate; do not silently suppress the full audit report.
      - run: npm audit --omit=dev --audit-level=critical
      - run: npx expo export --platform web --output-dir dist
        env:
          EXPO_PUBLIC_API_BASE_URL: http://localhost:5000

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/setup.mjs
      - run: docker compose --env-file .env.docker up --build -d --wait --wait-timeout 240
      - run: python scripts/smoke.py
      - if: failure()
        run: docker compose --env-file .env.docker logs --tail=80
      - if: always()
        run: docker compose --env-file .env.docker down
