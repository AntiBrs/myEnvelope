name: myenvelope

services:
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    networks: [edge]
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Run node scripts/setup.mjs first}
      DB_HOST: db
      DB_USER: myenvelope_app
      DB_PASSWORD: ${DB_PASSWORD:?Run node scripts/setup.mjs first}
      DB_NAME: myenvelope
      REDIS_URL: redis://redis:6379/0
      TRUST_PROXY: "true"
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    networks: [edge, data]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/ready', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: myenvelope
      MYSQL_USER: myenvelope_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?Run node scripts/setup.mjs first}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run node scripts/setup.mjs first}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./docker/db-permissions.sql:/docker-entrypoint-initdb.d/02-permissions.sql:ro
    restart: unless-stopped
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -u myenvelope_app -D myenvelope -e 'SELECT userId FROM User LIMIT 0' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes", --appendfsync, always, --maxmemory-policy, noeviction]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks: [data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 5

  n8n:
    image: docker.n8n.io/n8nio/n8n:2
    profiles: [assistant]
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Run node scripts/setup.mjs first}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_SECURE_COOKIE: "false" # Localhost HTTP only; use true behind HTTPS.
      N8N_DIAGNOSTICS_ENABLED: "false"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n/workflow.example.json:/opt/myenvelope/workflow.json:ro
    networks: [edge]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

networks:
  edge:
  data:
    internal: true

volumes:
  mysql-data:
  redis-data:
  n8n-data:
